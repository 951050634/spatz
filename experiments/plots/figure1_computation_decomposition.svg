<text x="55.0" y="375.0" font-size="18" font-weight="normal" fill="#3F3F3F" text-anchor="start" dominant-baseline="middle">loop-carried state • maximum / exponential / reciprocal • low data-level parallelism</text>
<text x="525.0" y="456.0" font-size="19" font-weight="bold" fill="#4C72B0" text-anchor="middle" dominant-baseline="middle">specialization target</text>
