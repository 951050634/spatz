<text x="1422.5" y="316.0" font-size="17" font-weight="normal" fill="#3F3F3F" text-anchor="middle" dominant-baseline="middle">j=1: independent multiply-add</text>
<rect x="1180.0" y="355.0" width="485.0" height="42.0" rx="5" fill="#FFFFFF" stroke="#4E8F65" stroke-width="2"/>
<text x="1422.5" y="376.0" font-size="17" font-weight="normal" fill="#3F3F3F" text-anchor="middle" dominant-baseline="middle">j=2: independent multiply-add</text>
<rect x="1180.0" y="415.0" width="485.0" height="42.0" rx="5" fill="#FFFFFF" stroke="#4E8F65" stroke-width="2"/>
<text x="1422.5" y="436.0" font-size="17" font-weight="normal" fill="#3F3F3F" text-anchor="middle" dominant-baseline="middle">j=3: independent multiply-add</text>
<text x="1422.0" y="492.0" font-size="18" font-weight="bold" fill="#4E8F65" text-anchor="middle" dominant-baseline="middle">reuse existing vector datapath</text>
